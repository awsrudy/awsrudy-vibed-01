# AWS Blog Sources Configuration

sources:
  - id: aws-news
    name: AWS News Blog
    url: https://aws.amazon.com/blogs/aws/
    rss: https://aws.amazon.com/blogs/aws/feed/
    category: News
    enabled: true
    description: Official AWS product announcements and updates

  - id: aws-architecture
    name: AWS Architecture Blog
    url: https://aws.amazon.com/blogs/architecture/
    rss: https://aws.amazon.com/blogs/architecture/feed/
    category: Architecture
    enabled: true
    description: Best practices, reference architectures, and diagrams

  - id: aws-devops
    name: AWS DevOps Blog
    url: https://aws.amazon.com/blogs/devops/
    rss: https://aws.amazon.com/blogs/devops/feed/
    category: DevOps
    enabled: true
    description: CI/CD, infrastructure as code, and automation

  - id: aws-security
    name: AWS Security Blog
    url: https://aws.amazon.com/blogs/security/
    rss: https://aws.amazon.com/blogs/security/feed/
    category: Security
    enabled: true
    description: Security best practices and compliance guidance

  - id: aws-compute
    name: AWS Compute Blog
    url: https://aws.amazon.com/blogs/compute/
    rss: https://aws.amazon.com/blogs/compute/feed/
    category: Compute
    enabled: true
    description: EC2, Lambda, containers, and serverless computing
