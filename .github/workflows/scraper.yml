name: Daily Scraper

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper git operations

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        id: scrape
        run: |
          python scraper/main.py
          echo "scrape_status=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check scraper results
        run: |
          if [ "${{ steps.scrape.outputs.scrape_status }}" != "0" ]; then
            echo "::warning::Scraper completed with errors"
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add data files
          git add _data/posts.json _data/backups/*.json 2>/dev/null || true

          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Update scraped posts [automated]

            - Updated posts.json with latest AWS blog content
            - Created backup of previous data
            - Scraper run: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

            git push
            echo "Changes committed and pushed successfully"
          fi
