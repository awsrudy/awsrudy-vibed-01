---
layout: default
title: Search
description: Search AWS blog posts
---

<div class="search-page">
  <div class="container">
    <h1>Search Posts</h1>

    <div class="search-interface">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search for AWS services, topics, or keywords..." aria-label="Search">
        <button id="search-button" aria-label="Search">Search</button>
      </div>

      <div class="search-filters">
        <div class="filter-group">
          <label for="filter-source">Source:</label>
          <select id="filter-source">
            <option value="">All Sources</option>
            {% for source in site.data.sources.sources %}
            <option value="{{ source.name }}">{{ source.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-service">AWS Service:</label>
          <select id="filter-service">
            <option value="">All Services</option>
            {% if site.data.posts.statistics.top_services %}
            {% for service in site.data.posts.statistics.top_services limit:20 %}
            <option value="{{ service.service }}">{{ service.service }}</option>
            {% endfor %}
            {% endif %}
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-code">Has Code:</label>
          <input type="checkbox" id="filter-code">
        </div>

        <button id="clear-filters">Clear Filters</button>
      </div>
    </div>

    <div id="search-results"></div>
  </div>
</div>

<link rel="stylesheet" href="{{ '/assets/pagefind/pagefind-ui.css' | relative_url }}">
<script src="{{ '/assets/pagefind/pagefind-ui.js' | relative_url }}"></script>

<script>
// Initialize Pagefind
window.addEventListener('DOMContentLoaded', () => {
  new PagefindUI({
    element: "#search-results",
    showSubResults: true,
    showImages: false,
    excerptLength: 30
  });
});

// Client-side filtering
const filterPosts = () => {
  const source = document.getElementById('filter-source').value;
  const service = document.getElementById('filter-service').value;
  const hasCode = document.getElementById('filter-code').checked;

  // Pagefind handles search, we add filters on top
  // Implementation depends on Pagefind API
  console.log('Filters:', { source, service, hasCode });
};

document.getElementById('filter-source')?.addEventListener('change', filterPosts);
document.getElementById('filter-service')?.addEventListener('change', filterPosts);
document.getElementById('filter-code')?.addEventListener('change', filterPosts);

document.getElementById('clear-filters')?.addEventListener('click', () => {
  document.getElementById('filter-source').value = '';
  document.getElementById('filter-service').value = '';
  document.getElementById('filter-code').checked = false;
  filterPosts();
});
</script>

<style>
.search-page {
  padding: 2rem 0;
}

.search-interface {
  background: white;
  padding: 2rem;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  margin-bottom: 2rem;
}

.search-box {
  display: flex;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

#search-input {
  flex: 1;
  padding: 0.75rem 1rem;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 1rem;
}

#search-button {
  padding: 0.75rem 2rem;
  background: #ff9900;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 500;
  transition: background 0.3s ease;
}

#search-button:hover {
  background: #e88800;
}

.search-filters {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  align-items: center;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.filter-group label {
  font-weight: 500;
  color: #232f3e;
}

.filter-group select {
  padding: 0.5rem;
  border: 1px solid #ddd;
  border-radius: 4px;
  background: white;
  cursor: pointer;
}

#clear-filters {
  padding: 0.5rem 1rem;
  background: #ddd;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 500;
}

#clear-filters:hover {
  background: #ccc;
}

#search-results {
  margin-top: 2rem;
}

/* Responsive design */
@media (max-width: 768px) {
  .search-box {
    flex-direction: column;
  }

  .search-filters {
    flex-direction: column;
    align-items: stretch;
  }

  .filter-group {
    flex-direction: column;
    align-items: flex-start;
  }
}
</style>
